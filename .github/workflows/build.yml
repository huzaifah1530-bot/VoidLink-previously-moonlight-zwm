name: Build sideload IPA
on:
  push:
    branches: [sideload-ipa]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build unsigned device archive
        run: |
          set -o pipefail
          xcodebuild -project VoidLink.xcodeproj -scheme VoidLink -sdk iphoneos -destination 'generic/platform=iOS' -configuration Release archive -archivePath "$PWD/build/VoidLink.xcarchive" CODE_SIGN_IDENTITY='' CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO CODE_SIGN_ENTITLEMENTS='' 2>&1 | tee build.log
      - name: Package IPA
        run: |
          mkdir -p build/IPA/Payload
          cp -R build/VoidLink.xcarchive/Products/Applications/VoidLink.app build/IPA/Payload/
          cd build/IPA
          zip -qry ../VoidLink-unsigned.ipa Payload
          cd ..
          unzip -t VoidLink-unsigned.ipa
          shasum -a 256 VoidLink-unsigned.ipa > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: VoidLink-unsigned-IPA
          path: |
            build/VoidLink-unsigned.ipa
            build/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
